name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela runs en curso de la misma rama/PR cuando llega un push nuevo (ahorra minutos de CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, lint, test, security
    runs-on: ubuntu-latest
    steps:
      # Versiones con runtime Node 24 (las v4/v5/v8 usaban Node 20, ya deprecado en runners).
      - uses: actions/checkout@v5
        with:
          # Necesario para que --new-from-rev / only-new-issues y git blame funcionen.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # check-latest: sin él, setup-go resuelve "1.25" desde su caché local del runner y puede
          # quedarse en un parche viejo; govulncheck falla al salir un security release de la
          # stdlib (13-ago-2026: GO-2026-5972/6089/6090/6218, corregidas en go1.25.12/13).
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      # golangci-lint v2 'run' incluye gosec y staticcheck, y reporta también
      # los problemas de formato (gofumpt/goimports) declarados en formatters.
      - name: Lint + formato + seguridad estática
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.0
          # En pull requests, solo falla por problemas NUEVOS (baseline para legacy).
          # En push a main corre completo.
          only-new-issues: true

      - name: Tests + race detector + cobertura
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Vulnerabilidades conocidas en dependencias
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # OPCIONAL (recomendado por ser datos de salud): sube hallazgos de seguridad
  # a la pestaña Security de GitHub como SARIF. Descomenta si quieres activarlo.
