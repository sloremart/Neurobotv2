name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela runs en curso de la misma rama/PR cuando llega un push nuevo (ahorra minutos de CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, lint, test, security
    runs-on: ubuntu-latest
    steps:
      # Versiones con runtime Node 24 (las v4/v5/v8 usaban Node 20, ya deprecado en runners).
      - uses: actions/checkout@v5
        with:
          # Necesario para que --new-from-rev / only-new-issues y git blame funcionen.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # check-latest: sin él, setup-go resuelve "1.26" desde su caché local del runner y puede
          # quedarse en un parche viejo; govulncheck falla al salir un security release de la stdlib.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      # golangci-lint v2 'run' incluye gosec y staticcheck, y reporta también
      # los problemas de formato (gofumpt/goimports) declarados en formatters.
      - name: Lint + formato + seguridad estática
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.0
          # En pull requests, solo falla por problemas NUEVOS (baseline para legacy).
          # En push a main corre completo.
          only-new-issues: true

      - name: Tests + race detector + cobertura
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Vulnerabilidades conocidas en dependencias
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # La imagen del bot abre los PDF de los pacientes con Ghostscript: debe correr sin root y con un gs
  # que no sea más viejo que GS_MIN_VERSION. Una rama de Alpine sin soporte sigue sirviendo su gs viejo
  # sin error, así que la fijación del Dockerfile sola no lo detecta. Subir GS_MIN_VERSION al mover la
  # fijación de docker/Dockerfile.
  image:
    name: Imagen Docker (sin root, Ghostscript mínimo)
    runs-on: ubuntu-latest
    env:
      GS_MIN_VERSION: "10.08.0"
    steps:
      - uses: actions/checkout@v5

      - name: Build de la imagen
        run: docker build -f docker/Dockerfile -t neuro-bot:ci .

      - name: Sin root y Ghostscript mínimo
        run: |
          uid=$(docker run --rm --entrypoint id neuro-bot:ci -u)
          if [ "$uid" = "0" ]; then echo "::error::la imagen corre como root"; exit 1; fi
          gs=$(docker run --rm --entrypoint gs neuro-bot:ci --version)
          lowest=$(printf '%s\n%s\n' "$GS_MIN_VERSION" "$gs" | sort -V | head -1)
          if [ "$lowest" != "$GS_MIN_VERSION" ]; then
            echo "::error::Ghostscript $gs es más viejo que el mínimo $GS_MIN_VERSION"; exit 1
          fi
          echo "uid=$uid gs=$gs (mínimo $GS_MIN_VERSION)"

  # OPCIONAL (recomendado por ser datos de salud): sube hallazgos de seguridad
  # a la pestaña Security de GitHub como SARIF. Descomenta si quieres activarlo.
