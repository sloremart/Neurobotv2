# =============================================================================
# HIGH-LOAD OVERRIDE — Para soportar ~1000 chats/hora
# =============================================================================
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.high-load.yml up -d
#
# Para volver a normal:
#   docker compose up -d
# =============================================================================

services:
  bot:
    # Overlay de PRODUCCIÓN: NO cargar .env.testing aquí (filtraría PORT=8090, ngrok-free y
    # TESTING_ALWAYS_OPEN=true). El perfil de pruebas es docker-compose.testing.yml, aparte.
    env_file:
      - .env
      - .env.high-load
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '4.0'
        reservations:
          memory: 256M

  db:
    command: >
      --default-authentication-plugin=mysql_native_password
      --tls-version=TLSv1.2
      --mysqlx=0
      --innodb-buffer-pool-size=1G
      --max-connections=200
      --table-open-cache=400
      --sort-buffer-size=512K
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 1024M
